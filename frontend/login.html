<!DOCTYPE html>
<html>
  <head>
    <title>Demo Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/pages/login.css">
  </head>
  <body>
    <main class="login-page">
      <a href="amazon.html">
        <img class="login-logo" src="images/amazon-logo.png" alt="Amazon">
      </a>

      <form class="login-card js-login-form">
        <h1>Sign in</h1>

        <p class="demo-note">
          Use the persistent demo account to view saved orders and package-tracking progress.
        </p>

        <label for="username">Username</label>
        <input id="username" class="login-input js-username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" class="login-input js-password" type="password" autocomplete="current-password" required>

        <div class="login-error js-login-error"></div>

        <button class="login-button button-primary" type="submit">Sign in</button>

        <a class="guest-link js-continue-as-guest" href="amazon.html">Continue as a temporary guest</a>
      </form>
    </main>

    <script type="module" src="scripts/login.js"></script>
  </body>
</html>
